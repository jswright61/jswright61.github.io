<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1c1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PwGen">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-180.png">
  <title>Password Generator</title>
  <style>
    :root {
      --bg: #f5f4f0;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #dcdad3;
      --accent: #2f6f4f;
      --accent-text: #ffffff;
      --suffix: #b0451f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1c1e;
        --card: #26272a;
        --text: #f2f2f2;
        --muted: #9a9aa0;
        --border: #3a3b3f;
        --accent: #5fb98a;
        --accent-text: #0e1a13;
        --suffix: #f08a5d;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }
    main { width: 100%; max-width: 560px; }
    h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 12px;
    }
    #password {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 20px;
      font: 600 26px/1.35 ui-monospace, "SF Mono", Menlo, monospace;
      word-break: break-word;
      user-select: all;
      -webkit-user-select: all;
      min-height: 3.2em;
      cursor: pointer;
    }
    #password .suffix { color: var(--suffix); }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 10px 2px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      padding: 4px 12px;
      cursor: pointer;
    }
    .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); font-weight: 600; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions button {
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      line-height: 1;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .actions button:active { transform: scale(0.98); }
    #status { height: 1.4em; margin-top: 12px; text-align: center; color: var(--muted); font-size: 14px; }
    footer { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Password Generator</h1>
    <div id="password" title="Click to copy" aria-live="polite">&nbsp;</div>
    <div class="meta">
      <span id="entropy"></span>
      <span class="seg" role="group" aria-label="Number of words">
        <button type="button" data-words="4">4 words</button>
        <button type="button" data-words="5">5 words</button>
      </span>
    </div>
    <div class="actions">
      <button type="button" id="generate">New</button>
      <button type="button" id="copy" class="primary">Copy</button>
    </div>
    <div id="status"></div>
    <footer>
      Generated on this device; nothing is sent anywhere.<br>
      Words: 1Password Agile Wordlist (<a href="words.LICENSE.txt">Apache 2.0</a>).
    </footer>
  </main>

  <script>
    "use strict";

    const SPECIAL_CHARS = "&@?!";
    const DIGITS = "0123456789";
    const WORD_COUNT_KEY = "pwgen.words";

    const passwordEl = document.getElementById("password");
    const entropyEl = document.getElementById("entropy");
    const statusEl = document.getElementById("status");
    const segButtons = document.querySelectorAll(".seg button");

    let wordlist = [];
    let password = "";
    let wordCount = 4;

    // Uniform integer in [0, n) from the CSPRNG, using rejection sampling to avoid modulo bias.
    function randomInt(n) {
      const limit = Math.floor(0x100000000 / n) * n;
      const buf = new Uint32Array(1);
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    }

    function sample(list) {
      return list[randomInt(list.length)];
    }

    function generateRandomString() {
      const special = sample(SPECIAL_CHARS);
      const length = randomInt(3) + 1;
      let digits = "";
      for (let i = 0; i < length; i++) digits += sample(DIGITS);
      return special + digits;
    }

    // Suffix always goes last: on iOS that's a single switch to the number keyboard.
    function generate() {
      const words = Array.from({ length: wordCount }, () => {
        const word = sample(wordlist);
        return word[0].toUpperCase() + word.slice(1);
      });
      const suffix = generateRandomString();
      password = `${words.join(" ")} ${suffix}`;

      passwordEl.textContent = "";
      passwordEl.append(words.join(" ") + " ");
      const span = document.createElement("span");
      span.className = "suffix";
      span.textContent = suffix;
      passwordEl.append(span);
      setStatus("");
    }

    function entropyBits() {
      // 1-3 digits with length chosen uniformly: log2(3) + mean of log2(10^k) for k = 1..3.
      const digitBits = Math.log2(3) + (Math.log2(10) * (1 + 2 + 3)) / 3;
      return wordCount * Math.log2(wordlist.length) + Math.log2(SPECIAL_CHARS.length) + digitBits;
    }

    function setWordCount(n) {
      wordCount = n;
      segButtons.forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.words) === n)));
      entropyEl.textContent = `≈ ${Math.round(entropyBits())} bits`;
      try { localStorage.setItem(WORD_COUNT_KEY, String(n)); } catch (_) {}
    }

    let statusTimer;
    function setStatus(text) {
      statusEl.textContent = text;
      clearTimeout(statusTimer);
      if (text) statusTimer = setTimeout(() => (statusEl.textContent = ""), 2000);
    }

    async function copy() {
      if (!password) return;
      try {
        await navigator.clipboard.writeText(password);
        setStatus("Copied");
      } catch (_) {
        // Fallback: select the text so the user can copy manually.
        const range = document.createRange();
        range.selectNodeContents(passwordEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        setStatus("Selected. Press copy to finish");
      }
    }

    document.getElementById("generate").addEventListener("click", generate);
    document.getElementById("copy").addEventListener("click", copy);
    passwordEl.addEventListener("click", copy);
    segButtons.forEach((b) => b.addEventListener("click", () => {
      setWordCount(Number(b.dataset.words));
      generate();
    }));

    async function init() {
      const res = await fetch("words.txt");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      wordlist = (await res.text()).split("\n").map((w) => w.trim()).filter(Boolean);

      let saved = 4;
      try { saved = Number(localStorage.getItem(WORD_COUNT_KEY)) || 4; } catch (_) {}
      setWordCount(saved === 5 ? 5 : 4);
      generate();
    }

    init().catch((err) => {
      passwordEl.textContent = "Couldn't load the wordlist.";
      setStatus(String(err));
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
